[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "coolhaven"
version = "0.1.0"
description = "Resilient, equitable cooling-hub placement with a from-scratch NSGA-II solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "plotly>=6,<7", "streamlit>=1.50,<2", "pandas>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
coolhaven = "coolhaven.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
